[package]
name = "petit-paint"
version = "0.2.0"
edition = "2024"
authors = ["saki"]
description = "A small paint app written in Rust with GPUI"
repository = "https://github.com/sakihet/petit-paint"
keywords = ["paint", "drawing", "gpui"]
categories = ["graphics"]
license = "MIT"
publish = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23"
cosmic-text = "0.19.0"
gpui-kit = "0.9.0"
gpui-pre-platform = { version = "=0.3.11", features = ["runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
lyon = "1.0.19"
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt"] }
ttf-parser = "0.25.1"
