[package]
name = "petit-paint"
version = "0.1.0"
edition = "2024"
description = "A small paint app written in Rust with GPUI"
repository = "https://github.com/sakihet/petit-paint"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
cosmic-text = "0.19.0"
gpui-kit = "0.9.0"
gpui-pre-platform = { version = "=0.3.11", features = ["runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
lyon = "1.0.19"
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
